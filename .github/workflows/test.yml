name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Run vitest suite
        run: npm test

      - name: Setup uv (Python sidecar)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python deps via uv
        working-directory: sidecar
        run: uv sync

      - name: Run pytest suite
        working-directory: sidecar
        run: uv run pytest -v
