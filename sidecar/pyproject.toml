[project]
name = "stock-tracker-sidecar"
version = "0.1.0"
description = "SEC EDGAR ingestion sidecar for stock-tracker"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "edgartools>=5.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
